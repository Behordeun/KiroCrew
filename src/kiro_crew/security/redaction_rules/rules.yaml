# The credential rule table: the only place a redaction rule is defined.
#
# Each row names its tier (what a matched value can do), its detector (how the
# value is found) and what is replaced. `rules.py` validates every row at load
# and refuses an unknown field, tier, detector or validator.
#
#   pattern     regex; the named group `v` is the span `replace: value` removes.
#               Every repeat must be bounded.
#   labels      field or parameter names. Compared lowercase with `-`, `_`, `.`
#               and spaces removed; `labelled` matches a name or its suffix,
#               `url_param` the exact name.
#   pair_with   key_id_pair only: an anchor that must occur within `window`
#               characters of the value.
#   validate    a named check in rules.VALIDATORS.
#   replace     `value` (default) or `match`.
#   through_end structural + replace: match only: the hit runs from the match
#               to the end of the text (a block with no closing line).
#   allow       values that look like a match but are not secrets.
#   corpus      rules/<id>: the rule's true positives, known false positives
#               and bypass shapes.
#
# There is deliberately no entropy rule, no length-only rule and no detector
# that fires on a value's shape alone.

version: 1

allow:
  values: [changeme, placeholder, example, 'true', 'false', 'null', none]
  patterns:
    # A template placeholder (`${VAR}`, `${{ x }}`, `{{ x }}`), or a run of up
    # to eight joined by at most three of ` -/:.,_`. A `{{ }}` body may hold a
    # lone `}` and ends at the first `}}`. Text glued after the run does not
    # match.
    - '(?:\$\{[^{}\r\n]{1,200}\}|\$?\{\{(?:[^}\r\n]|\}(?!\})){0,200}\}\})(?:[ \t\-/:.,_]{0,3}(?:\$\{[^{}\r\n]{1,200}\}|\$?\{\{(?:[^}\r\n]|\}(?!\})){0,200}\}\})){0,7}'
    # An environment-variable reference. Upper case only, so a password that
    # starts with `$` is not mistaken for one.
    - '\$[A-Z_][A-Z0-9_]{0,127}'
    - '<[^<>\r\n]{1,200}>'
    - '%[A-Za-z_][A-Za-z0-9_]{0,127}%'
    - '\*{3,200}'
    - '(?i:x{3,200})'
    - '\.{3,200}|…{1,200}'
    - '(?i:your[-_][A-Za-z0-9_.-]{0,200})'

label_exclude:
  - token_type
  - expires_in
  - next_token
  - page_token
  - max_tokens
  - input_tokens
  - output_tokens
  - token_endpoint
  - secret_name
  - secret_arn
  - key_id
  - public_key
  - tokenizer
  - credential_scope

rules:
  # ── checksum_prefix ──
  - id: github.classic
    tier: secret
    detector: checksum_prefix
    pattern: '(?<![A-Za-z0-9_])(?P<v>gh[pousr]_[A-Za-z0-9]{36})(?![A-Za-z0-9_])'
    validate: github_crc32
    corpus: rules/github.classic

  # ── vendor_prefix ──
  - id: github.fine_grained
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_])(?P<v>github_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59})(?![A-Za-z0-9_])'
    corpus: rules/github.fine_grained

  - id: slack.token
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_-])(?P<v>xox[abposr]-[A-Za-z0-9-]{10,250})(?![A-Za-z0-9_-])'
    corpus: rules/slack.token

  - id: slack.webhook
    tier: bearer_link
    detector: vendor_prefix
    pattern: 'https://hooks\.slack\.com/services/T[A-Z0-9]{8,12}/B[A-Z0-9]{8,12}/(?P<v>[A-Za-z0-9]{20,40})(?![A-Za-z0-9])'
    corpus: rules/slack.webhook

  - id: discord.webhook
    tier: bearer_link
    detector: vendor_prefix
    pattern: 'https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/(?P<v>[A-Za-z0-9_-]{60,80})(?![A-Za-z0-9_-])'
    corpus: rules/discord.webhook

  - id: stripe.key
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_])(?P<v>(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,247})(?![A-Za-z0-9_])'
    corpus: rules/stripe.key

  # TODO: confirm the marker against the current project and service-account
  # key formats before a seam relies on this row.
  - id: openai.key
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_-])(?P<v>sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{0,200}T3BlbkFJ[A-Za-z0-9_-]{1,200})(?![A-Za-z0-9_-])'
    corpus: rules/openai.key

  - id: anthropic.key
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_-])(?P<v>sk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_-]{80,200})(?![A-Za-z0-9_-])'
    corpus: rules/anthropic.key

  - id: google.api_key
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_-])(?P<v>AIza[A-Za-z0-9_-]{35})(?![A-Za-z0-9_-])'
    corpus: rules/google.api_key

  - id: google.oauth_client_secret
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_-])(?P<v>GOCSPX-[A-Za-z0-9_-]{20,64})(?![A-Za-z0-9_-])'
    corpus: rules/google.oauth_client_secret

  # Telegram bot token: ``<bot_id>:<secret>``. Bot ID is 6-12 digits, secret is 30-50
  # URL-safe base64 chars. The lookbehind `(?<![0-9])` prevents matching mid-run in a
  # longer digit sequence (e.g., timestamps), but deliberately allows letters so that
  # `bot<TOKEN>` in Telegram API URLs is caught. Over-redacting a rare ``digits:token``
  # lookalike is the safe direction. The one shape kept is a CDK-generated ARN
  # resource, `arn:...:<12-digit account>:<CDK name>` (see `outside_cdk_arn`).
  - id: telegram.token
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![0-9])(?P<v>[0-9]{6,100}:[A-Za-z0-9_-]{30,1000})(?![A-Za-z0-9_-])'
    validate: outside_cdk_arn
    corpus: rules/telegram.token

  - id: discord.token
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_-])(?P<v>[MNO][A-Za-z0-9_-]{22,30}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{25,1000})(?![A-Za-z0-9_-])'
    corpus: rules/discord.token

  - id: gitlab.pat
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_-])(?P<v>glpat-[A-Za-z0-9_-]{20,64})(?![A-Za-z0-9_-])'
    corpus: rules/gitlab.pat

  - id: npm.token
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_])(?P<v>npm_[A-Za-z0-9]{36})(?![A-Za-z0-9_])'
    corpus: rules/npm.token

  - id: pypi.token
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_-])(?P<v>pypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,1000})(?![A-Za-z0-9_-])'
    corpus: rules/pypi.token

  - id: sendgrid.key
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_.-])(?P<v>SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43})(?![A-Za-z0-9_-])'
    corpus: rules/sendgrid.key

  - id: twilio.api_key
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_])(?P<v>SK[0-9a-f]{32})(?![A-Za-z0-9_])'
    corpus: rules/twilio.api_key

  - id: hashicorp.vault
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_.-])(?P<v>hv[sbr]\.[A-Za-z0-9_-]{24,250})(?![A-Za-z0-9_-])'
    corpus: rules/hashicorp.vault

  - id: hashicorp.terraform
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_.-])(?P<v>[A-Za-z0-9]{14}\.atlasv1\.[A-Za-z0-9_-]{60,70})(?![A-Za-z0-9_-])'
    corpus: rules/hashicorp.terraform

  - id: shopify.token
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_])(?P<v>shp(?:at|ca|pa|ss)_[a-fA-F0-9]{32})(?![A-Za-z0-9_])'
    corpus: rules/shopify.token

  - id: digitalocean.token
    tier: secret
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_])(?P<v>do[opr]_v1_[a-f0-9]{64})(?![A-Za-z0-9_])'
    corpus: rules/digitalocean.token

  - id: aws.access_key_id
    tier: identifier
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9+/_-])(?P<v>(?:AKIA|ASIA|AROA|AIDA)[A-Z0-9]{16})(?![A-Za-z0-9+=_-])'
    corpus: rules/aws.access_key_id

  - id: twilio.account_sid
    tier: identifier
    detector: vendor_prefix
    pattern: '(?<![A-Za-z0-9_])(?P<v>AC[0-9a-f]{32})(?![A-Za-z0-9_])'
    corpus: rules/twilio.account_sid

  # ── structural ──
  # The key type is any run of capitals and spaces (`RSA `, `EC `, `OPENSSH `,
  # `ENCRYPTED `, `DH `), as the legacy pass read it.
  - id: pem.private_key
    tier: secret
    detector: structural
    pattern: '-----BEGIN (?P<k>[A-Z ]{0,60})PRIVATE KEY-----[\s\S]{1,16000}?-----END (?P=k)PRIVATE KEY-----'
    replace: match
    corpus: rules/pem.private_key

  # A private-key header that no matching END line follows within the block
  # bound (a key cut off mid-paste or by a truncated log line): everything from
  # the header to the end of the text is replaced, since nothing marks where
  # the key material stops.
  - id: pem.private_key_unterminated
    tier: secret
    detector: structural
    pattern: '-----BEGIN (?P<k>[A-Z ]{0,60})PRIVATE KEY-----(?![\s\S]{1,16000}?-----END (?P=k)PRIVATE KEY-----)'
    replace: match
    through_end: true
    corpus: rules/pem.private_key_unterminated

  # `\x20` stands for the space in the armour line, so this row is not itself
  # read as a key block by secret scanners.
  - id: pgp.private_key
    tier: secret
    detector: structural
    pattern: '-----BEGIN PGP PRIVATE\x20KEY BLOCK-----[\s\S]{1,16000}?-----END PGP PRIVATE\x20KEY BLOCK-----'
    replace: match
    corpus: rules/pgp.private_key

  # Any scheme, glued to the text before it or not, an empty user, and a
  # password holding `@` (read to the last `@` of the authority), as the legacy
  # pass read it. Only the password is replaced.
  - id: url.userinfo_password
    tier: secret
    detector: structural
    pattern: '[A-Za-z][A-Za-z0-9+.-]{0,31}://[^\s:/@"''<>`]{0,256}:(?P<v>[^\s/"''<>`]{1,256})@'
    corpus: rules/url.userinfo_password

  - id: jwt
    tier: secret
    detector: structural
    pattern: '(?<![A-Za-z0-9_.-])(?P<v>eyJ[A-Za-z0-9_-]{4,2000}\.eyJ[A-Za-z0-9_-]{4,2000}\.[A-Za-z0-9_-]{1,2000})(?![A-Za-z0-9_.-])'
    validate: jwt_structure
    corpus: rules/jwt

  # JWE compact token: 5 dot-separated base64url segments (header.key.iv.ciphertext.tag).
  # Direct key (alg:dir) and ECDH-ES have an empty Encrypted Key segment (2nd), so {0,}.
  # Segment bounds: key 0-2000, iv 10-100, ciphertext 10-5000, tag 10-100.
  - id: jwe
    tier: secret
    detector: structural
    pattern: '(?<![A-Za-z0-9_.-])(?P<v>eyJ[A-Za-z0-9_-]{4,2000}\.[A-Za-z0-9_-]{0,2000}\.[A-Za-z0-9_-]{10,100}\.[A-Za-z0-9_-]{10,5000}\.[A-Za-z0-9_-]{10,100})(?![A-Za-z0-9_.-])'
    validate: jwe_structure
    corpus: rules/jwe

  # Two-segment link token: base64url(payload).base64url(hmac_sig). The signature is
  # always 43 chars (HMAC-SHA256 base64url-unpadded). The payload floor (96) is derived
  # from the generator's minimum claim set; see redaction_patterns.py for the derivation.
  - id: link_token
    tier: bearer_link
    detector: structural
    pattern: '(?<![A-Za-z0-9_-])(?P<v>eyJ[A-Za-z0-9_-]{96,500}\.[A-Za-z0-9_-]{43})(?![A-Za-z0-9_-])'
    validate: link_token_structure
    corpus: rules/link_token

  # ── unverified fallbacks ──
  # The legacy pass's vendor spellings, kept behind the exact rows so the table
  # misses nothing that pass caught. A validator only chooses between secret
  # rules: a token with a vendor prefix that fails a checksum, marker or exact
  # length (a mistyped, rotated, shortened or over-long key, or one glued to a
  # word) is still a secret. These rows have the legacy pass's bounds and, like
  # it, no word boundaries. On the same span the exact row wins (more certain
  # detector, then the lower rule id); a fallback hit names its own row.
  - id: github.unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>gh[pousr]_[A-Za-z0-9]{30,1000}|github_pat_[A-Za-z0-9_]{40,1000})'
    corpus: rules/github.unverified

  - id: slack.token_unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>xox[bpas]-[0-9a-zA-Z-]{10,1000})'
    corpus: rules/slack.token_unverified

  - id: gitlab.pat_unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>glpat-[A-Za-z0-9_-]{16,1000})'
    corpus: rules/gitlab.pat_unverified

  - id: stripe.key_unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,1000})'
    corpus: rules/stripe.key_unverified

  - id: sendgrid.key_unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>SG\.[A-Za-z0-9_-]{16,1000}\.[A-Za-z0-9_-]{16,1000})'
    corpus: rules/sendgrid.key_unverified

  - id: openai.key_unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{16,1000})'
    corpus: rules/openai.key_unverified

  - id: anthropic.key_unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>sk-ant-[A-Za-z0-9_-]{16,1000})'
    corpus: rules/anthropic.key_unverified

  - id: npm.token_unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>npm_[A-Za-z0-9]{24,1000})'
    corpus: rules/npm.token_unverified

  - id: pypi.token_unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>pypi-[A-Za-z0-9_-]{16,1000})'
    corpus: rules/pypi.token_unverified

  - id: digitalocean.token_unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>do[opr]_v1_[A-Za-z0-9]{40,1000})'
    corpus: rules/digitalocean.token_unverified

  - id: google.oauth_client_secret_unverified
    tier: secret
    detector: vendor_prefix
    pattern: '(?P<v>GOCSPX-[A-Za-z0-9_-]{20,1000})'
    corpus: rules/google.oauth_client_secret_unverified

  # A JOSE token the exact jwt/jwe rows reject (`alg: none`, a payload that is
  # not JSON, a segment count or length they do not take) whose header is still
  # a JSON object: the legacy pass's 3-to-5-segment shape. It may start inside a
  # word (`monkeyJ<token>`), up to 64 characters into its run, as the legacy
  # pass read it; only a run's start is tried, so a long run costs one read.
  - id: jwt.unverified
    tier: secret
    detector: structural
    pattern: '(?<![A-Za-z0-9_-])[A-Za-z0-9_-]{0,64}?(?P<v>eyJ[A-Za-z0-9_-]{1,100000}(?:\.[A-Za-z0-9_-]{0,100000}){2,4})'
    validate: jose_header
    corpus: rules/jwt.unverified

  # An AWS secret-key or session-token field name glued to the end of a longer
  # run (`...Ab1SecretAccessKey = <value>`), which the labelled detector does not
  # read as a field name: the legacy pass's spelling, label included.
  - id: aws.secret_field_glued
    tier: secret
    detector: structural
    pattern: '(?<=[A-Za-z0-9_.\-])(?:SecretAccessKey|aws_secret_access_key|SessionToken|aws_session_token)["'']?\s{0,8}[:=]\s{0,8}["'']?[^\s"'',}]{1,20000}'
    replace: match
    corpus: rules/aws.secret_field_glued

  # A two-segment link token whose payload is not a JSON object.
  - id: link_token.unverified
    tier: bearer_link
    detector: structural
    pattern: '(?<![A-Za-z0-9_.-])(?P<v>eyJ[A-Za-z0-9_-]{96,5000}\.[A-Za-z0-9_-]{43})(?![A-Za-z0-9_-])'
    corpus: rules/link_token.unverified

  # ── labelled ──
  - id: labelled.secret_field
    tier: secret
    detector: labelled
    labels:
      - password
      - passwd
      - pwd
      - passphrase
      - secret
      - client_secret
      - api_key
      - api_secret
      - api_token
      - access_token
      - auth_token
      - refresh_token
      - session_token
      - security_token
      - bearer_token
      - token
      - private_key
      - secret_key
      - secret_access_key
      - account_key
      - shared_access_key
      # A vendor field name (Rails, Meilisearch, Azure Cosmos), kept as written.
      - master_key  # wokeignore:rule=master
      - authorization
      - x-api-key
      - dd_api_key
      - dd_app_key
      - datadog_api_key
      - app_key
      - auth_key
      - signing_key
      - encryption_key
      - webhook_secret
      - credential
      - credentials
    allow:
      # Status and schema words a credential field holds in place of a value.
      # The match is the whole value, case-insensitive: `enabledXYZ` is still
      # redacted. A credential whose real value is exactly one of these words
      # (`password=enabled`) is kept; that trade was accepted in review.
      # A documented example key (`...EXAMPLEKEY`) under a credential name is
      # still replaced, as the legacy pass replaced it: a real key can end the
      # same way, and the label says it is a secret.
      values: [required, optional, expired, revoked, invalid, missing, disabled,
               enabled, hidden, redacted, unset, empty, string]
    corpus: rules/labelled.secret_field

  - id: labelled.session_cookie
    tier: secret
    detector: labelled
    labels:
      - session
      - sessionid
      - phpsessid
      - jsessionid
      - connect.sid
      - aspnetsessionid
      - authcookie
    corpus: rules/labelled.session_cookie

  # ── key_id_pair ──
  - id: aws.secret_access_key
    tier: secret
    detector: key_id_pair
    pattern: '(?<![A-Za-z0-9/+])(?P<v>[A-Za-z0-9/+]{40})(?![A-Za-z0-9/+=])'
    pair_with:
      pattern: '(?<![A-Za-z0-9])(?:AKIA|ASIA)[A-Z0-9]{16}(?![A-Za-z0-9])'
      window: 300
    validate: aws_secret_shape
    allow:
      suffixes: [EXAMPLEKEY]
    corpus: rules/aws.secret_access_key

  # ── url_param ──
  - id: oauth.public_param
    tier: identifier
    detector: url_param
    labels:
      - client_id
      - state
      - nonce
      - code_challenge
      - code_challenge_method
      - redirect_uri
      - scope
      - response_type
    corpus: rules/oauth.public_param

  - id: url.credential_param
    tier: bearer_link
    detector: url_param
    labels:
      - token
      - access_token
      - auth_token
      - id_token
      - api_key
      - key
      - sig
      - signature
      - X-Amz-Signature
      - X-Amz-Security-Token
      - X-Goog-Signature
      - code
      - secret
      - password
      - client_secret
      - refresh_token
    corpus: rules/url.credential_param
